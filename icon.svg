<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4BD6"/>
      <stop offset="100%" stop-color="#D9644A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Фон со скруглением (для iOS и Android маска сама скруглит) -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- Блик сверху -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>

  <!-- Буква Р -->
  <text x="256" y="368"
        font-family="-apple-system, 'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="280"
        font-weight="900"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-10">Р</text>

  <!-- Маленькая цифра 144С снизу -->
  <text x="256" y="440"
        font-family="-apple-system, 'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="52"
        font-weight="700"
        fill="rgba(255,255,255,0.85)"
        text-anchor="middle"
        letter-spacing="4">144С</text>
</svg>
