<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4BD6"/>
      <stop offset="100%" stop-color="#D9644A"/>
    </linearGradient>
  </defs>

  <!-- Фон — во всю иконку (для maskable-иконок Android) -->
  <rect width="512" height="512" fill="url(#g)"/>

  <!-- Контент по центру, в safe-zone (80%) -->
  <g transform="translate(256, 256)">
    <text x="0" y="30"
          font-family="-apple-system, 'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="200"
          font-weight="900"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-6">Р</text>
    <text x="0"
          y="100"
          font-family="-apple-system, 'Inter', 'Segoe UI', Arial, sans-serif"
          font-size="46"
          font-weight="700"
          fill="rgba(255,255,255,0.9)"
          text-anchor="middle"
          letter-spacing="4">144С</text>
  </g>
</svg>
